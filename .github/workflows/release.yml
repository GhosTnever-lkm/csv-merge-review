name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - name: Build and validate release packages
        run: |
          python -c "import tomllib; from pathlib import Path; import os; version=tomllib.loads(Path('pyproject.toml').read_text())['project']['version']; tag=os.environ['GITHUB_REF_NAME']; assert tag == f'v{version}', f'tag {tag} does not match project version {version}'"
          python -m pip install build
          python -m build --outdir dist
          git archive --format=zip --prefix="csv-merge-review-${GITHUB_REF_NAME}/" "${GITHUB_REF_NAME}" -o "csv-merge-review-${GITHUB_REF_NAME}.zip"
          sha256sum dist/* "csv-merge-review-${GITHUB_REF_NAME}.zip" > SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*
            csv-merge-review-${{ github.ref_name }}.zip
            SHA256SUMS
