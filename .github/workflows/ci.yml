name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Smoke-test the installed CLI
        run: python -c "import csv, pathlib, subprocess, tempfile; d=pathlib.Path(tempfile.mkdtemp()); subprocess.run(['csv-merge-review','examples/base.csv','examples/ours.csv','examples/theirs.csv','--key','id','--output',str(d/'merged.csv')],check=True); assert (d/'merged.csv').is_file(); assert next(csv.reader((d/'merged.csv').open(encoding='utf-8')))==['id','mod_name','version','description']"
