<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="t d"><title id="t">CSV Merge Review demonstration</title><desc id="d">Two independent CSV edits change different fields, and the tool combines them without a conflict.</desc>
<rect width="1120" height="640" rx="22" fill="#0b1118"/><rect x="28" y="28" width="1064" height="584" rx="18" fill="#111a24" stroke="#304252"/><circle cx="60" cy="60" r="6" fill="#fb7185"/><circle cx="82" cy="60" r="6" fill="#fbbf24"/><circle cx="104" cy="60" r="6" fill="#34d399"/><text x="130" y="66" fill="#91a4b8" font-family="Arial,sans-serif" font-size="15">CSV MERGE REVIEW · THREE-WAY MERGE</text>
<text x="72" y="126" fill="#e5edf5" font-family="Arial,sans-serif" font-size="30" font-weight="700">Combine separate edits. Stop on real conflicts.</text><rect x="72" y="158" width="976" height="48" rx="10" fill="#091017" stroke="#2d3e4d"/><text x="94" y="189" fill="#8ce7be" font-family="monospace" font-size="15">$ csv-merge-review base.csv ours.csv theirs.csv --key id --output merged.csv</text>
<rect x="72" y="238" width="456" height="140" rx="12" fill="#16232e" stroke="#2b3c4b"/><text x="96" y="274" fill="#a9c0d4" font-family="Arial,sans-serif" font-size="14" font-weight="700">YOUR EDIT</text><text x="96" y="316" fill="#e5edf5" font-family="monospace" font-size="15">mod-01 · version = 1.1</text><text x="96" y="345" fill="#8fa3b7" font-family="Arial,sans-serif" font-size="13">description unchanged</text>
<rect x="592" y="238" width="456" height="140" rx="12" fill="#16232e" stroke="#2b3c4b"/><text x="616" y="274" fill="#a9c0d4" font-family="Arial,sans-serif" font-size="14" font-weight="700">OTHER EDIT</text><text x="616" y="316" fill="#e5edf5" font-family="monospace" font-size="15">mod-01 · version unchanged</text><text x="616" y="345" fill="#86efac" font-family="Arial,sans-serif" font-size="13">description updated</text>
<text x="560" y="315" fill="#a9ed79" font-family="Arial,sans-serif" font-size="23" text-anchor="middle">→</text><rect x="72" y="412" width="976" height="124" rx="13" fill="#14241c" stroke="#547552"/><text x="100" y="452" fill="#a9ed79" font-family="Arial,sans-serif" font-size="16" font-weight="700">✓ Clean merge · no conflicts</text><text x="100" y="488" fill="#e5edf5" font-family="monospace" font-size="15">mod-01 · version = 1.1 · description = updated description</text><text x="100" y="514" fill="#9ab5a6" font-family="Arial,sans-serif" font-size="12">The merged CSV is written atomically. If fields conflict, the output file is not created.</text>
<text x="72" y="574" fill="#8fa3b7" font-family="Arial,sans-serif" font-size="13">Local files · match by unique key · no last-writer-wins guessing · value-free JSON report</text></svg>
